[workspace]
resolver = "2"
members = ["crates/vex-core", "crates/vex-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/aarinb1/vexdb"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.4"
criterion = "0.5"
vex-core = { path = "crates/vex-core" }

[profile.release]
lto = "thin"
codegen-units = 1
